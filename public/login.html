<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abi's Study Buddy</title>
<!-- Deliberately self-contained: this page is served before any session
     exists, so it cannot rely on the gated stylesheets in css/. -->
<style>
  :root {
    --lilac-50: #F6F2FF; --lilac-100: #E9E0FF; --lilac-400: #B79CFF;
    --pink-50: #FFF2F8; --pink-400: #FF9EC4; --pink-600: #E75B96;
    --ink: #4A3457; --ink-soft: #6B5578; --muted: #9C8BA8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 1.5rem; color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(closest-side at 20% 20%, var(--lilac-100), transparent 70%),
      radial-gradient(closest-side at 80% 75%, var(--pink-50), transparent 70%),
      var(--lilac-50);
  }
  .card {
    width: 100%; max-width: 24rem; background: #fff; text-align: center;
    border-radius: 1.5rem; padding: 2.5rem 2rem;
    box-shadow: 0 18px 50px rgba(74, 52, 87, .13);
  }
  .star { font-size: 2.5rem; display: block; margin-bottom: .4rem; }
  h1 { margin: 0 0 .3rem; font-size: 1.45rem; }
  p.sub { margin: 0 0 1.6rem; color: var(--ink-soft); font-size: .95rem; }
  input {
    width: 100%; font: inherit; font-size: 1.05rem; text-align: center;
    padding: .8rem 1rem; margin-bottom: .9rem;
    border: 2px solid var(--lilac-100); border-radius: .9rem;
    background: var(--lilac-50); color: inherit;
  }
  input:focus { outline: none; border-color: var(--lilac-400); background: #fff; }
  button {
    width: 100%; font: inherit; font-weight: 700; font-size: 1.05rem;
    padding: .8rem 1rem; border: 0; border-radius: 999px; cursor: pointer;
    color: #fff; background: linear-gradient(135deg, var(--lilac-400), var(--pink-400));
  }
  button:disabled { opacity: .6; cursor: default; }
  .note { min-height: 1.4rem; margin: .9rem 0 0; font-size: .9rem; color: var(--pink-600); }
  .hint { margin: 1.4rem 0 0; font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>

<form class="card" id="form">
  <span class="star">✦</span>
  <h1>Abi's Study Buddy</h1>
  <p class="sub">Enter the password to carry on.</p>

  <input id="password" type="password" autocomplete="current-password"
         placeholder="Password" aria-label="Password" required autofocus>
  <button id="go" type="submit">Let me in ✨</button>

  <p class="note" id="note" role="alert"></p>
  <p class="hint">Ask Stephen if you have forgotten it.</p>
</form>

<script>
(function () {
  var form = document.getElementById('form');
  var field = document.getElementById('password');
  var button = document.getElementById('go');
  var note = document.getElementById('note');

  /* Only ever follow a same-site path, so a crafted ?next= cannot bounce her
     off to somebody else's page after a successful login.

     Resolved through the URL parser and checked by origin, rather than pattern
     matched. The previous test required a leading slash that was not followed
     by a second one, which correctly rejected "//evil.com" but still allowed
     "/\evil.com" — browsers normalise a backslash to a forward slash while
     resolving, so that lands on the same off-site address the check was
     written to stop. Anything the parser does not place on this origin, and
     any parse failure, falls back to the home page. */
  function destination() {
    var wanted = new URLSearchParams(location.search).get('next') || '/';
    try {
      var target = new URL(wanted, location.origin);
      if (target.origin !== location.origin) return '/';
      return target.pathname + target.search;
    } catch (e) {
      return '/';
    }
  }

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    button.disabled = true;
    note.textContent = '';

    try {
      var response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: field.value }),
      });

      if (response.ok) {
        location.replace(destination());
        return;
      }

      var body = await response.json().catch(function () { return {}; });
      note.textContent =
        body.error === 'too_many_attempts'
          ? 'Too many tries. Wait about fifteen minutes and try again.'
          : body.error === 'not_configured'
            ? 'The site is not finished being set up. Tell Stephen.'
            : 'That password is not right.';
    } catch (e) {
      note.textContent = 'Could not reach the site. Check your internet.';
    }

    button.disabled = false;
    field.select();
  });
})();
</script>

</body>
</html>

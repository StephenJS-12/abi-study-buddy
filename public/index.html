<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abi's Study Buddy</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div class="sky" aria-hidden="true"></div>

<header class="topbar">
  <button class="crumb" id="backBtn" type="button" hidden>
    <span class="crumb-arrow">←</span><span id="backLabel">Back</span>
  </button>
  <div class="brand" id="homeBtn" role="button" tabindex="0">
    <span class="brand-star">✦</span>
    <span class="brand-name">Abi's Study Buddy</span>
  </div>
  <div class="pointsdock">
    <div class="pointsdock-label">
      <span id="pointsCount">0</span><span class="pointsdock-cap" id="pointsCap"></span>
    </div>
    <div class="pbar" title="Your points">
      <div class="pbar-fill" id="pointsFill"></div>
      <div class="pbar-shine"></div>
    </div>
    <span class="pointsdock-goal" id="pointsGoal" aria-hidden="true">🎁</span>
  </div>
</header>

<div class="savewarn" id="saveWarn" role="alert" hidden></div>

<main id="screen" class="screen"></main>

<div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

<div class="modal-veil" id="modalVeil" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div id="modalBody"></div>
  </div>
</div>

<script src="js/cloud.js"></script>
<script src="js/storage.js"></script>
<script src="js/transfer.js"></script>
<script src="js/rewards.js"></script>
<script src="js/celebrate.js"></script>
<script src="js/rng.js"></script>
<script src="js/data/week1.js"></script>
<script src="js/data/week2.js"></script>
<script src="js/data/week3.js"></script>
<script src="js/data/week4.js"></script>
<script src="js/data/exam1.js"></script>
<script src="js/data/exam2.js"></script>
<script src="js/data/exam3.js"></script>
<script src="js/data/exam4.js"></script>
<script src="js/generators.js"></script>
<script src="js/examgen.js"></script>
<script src="js/examgen2.js"></script>
<script src="js/examgen3.js"></script>
<script src="js/examgen4.js"></script>
<script src="js/content.js"></script>
<script src="js/notes.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
